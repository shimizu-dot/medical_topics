<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>糖尿病治療薬 理解度テスト</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #fff;
      --text: #1f2937;
      --muted: #64748b;
      --line: #dbe3ee;
      --blue: #2563eb;
      --blue2: #eaf1ff;
      --green: #047857;
      --green2: #ecfdf5;
      --red: #b91c1c;
      --red2: #fef2f2;
      --amber: #b45309;
      --amber2: #fff7ed;
      --shadow: 0 10px 24px rgba(15, 23, 42, .08)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #eaf1ff 0, var(--bg) 260px);
      color: var(--text);
      line-height: 1.7
    }

    .wrap {
      max-width: 1040px;
      margin: 32px auto 56px;
      padding: 0 18px
    }

    .hero {
      background: linear-gradient(135deg, #1d4ed8, #0f766e);
      color: #fff;
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow)
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.9rem;
      line-height: 1.35
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.25rem;
      color: #17365d;
      border-left: 6px solid var(--blue);
      padding-left: 12px
    }

    .hero p {
      margin: 0;
      opacity: .95
    }

    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px
    }

    .tag {
      background: rgba(255, 255, 255, .16);
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 700;
      font-size: .9rem
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      margin-top: 20px;
      box-shadow: var(--shadow)
    }

    .question {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin: 18px 0;
      background: #fff
    }

    .qhead {
      font-weight: 800;
      color: #17365d;
      margin-bottom: 10px
    }

    .qtext {
      font-weight: 700;
      margin-bottom: 10px
    }

    label.option {
      display: block;
      margin: 9px 0;
      padding: 10px 12px;
      border: 1px solid #e5edf7;
      border-radius: 12px;
      background: #fbfdff;
      cursor: pointer
    }

    label.option:hover {
      background: #f3f7ff
    }

    input[type="checkbox"] {
      transform: scale(1.15);
      margin-right: 8px
    }

    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
      position: sticky;
      bottom: 12px;
      background: rgba(246, 248, 251, .9);
      backdrop-filter: blur(8px);
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line)
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer
    }

    #submitBtn {
      background: var(--blue);
      color: #fff
    }

    #resetBtn {
      background: #e5e7eb;
      color: #111827
    }

    .result {
      display: none
    }

    .scorebox {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin: 14px 0
    }

    .scoreitem {
      background: var(--blue2);
      border: 1px solid #cfe0ff;
      border-radius: 16px;
      padding: 16px;
      text-align: center
    }

    .scoreitem b {
      font-size: 1.8rem;
      color: var(--blue)
    }

    .review {
      border-radius: 16px;
      padding: 15px;
      margin: 12px 0;
      border: 1px solid var(--line)
    }

    .correct {
      background: var(--green2);
      border-color: #b7ebd2
    }

    .wrong {
      background: var(--red2);
      border-color: #f4b7b7
    }

    .partial {
      background: var(--amber2);
      border-color: #f2d3aa
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 10px;
      font-weight: 800;
      font-size: .86rem;
      margin-right: 8px
    }

    .badge.ok {
      background: #d1fae5;
      color: var(--green)
    }

    .badge.ng {
      background: #fee2e2;
      color: var(--red)
    }

    .badge.part {
      background: #ffedd5;
      color: var(--amber)
    }

    .small {
      font-size: .92rem;
      color: var(--muted)
    }

    .answer {
      font-weight: 800
    }

    .explain {
      margin-top: 8px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px
    }

    td,
    th {
      border: 1px solid var(--line);
      padding: 10px;
      text-align: left
    }

    th {
      background: #eef4ff;
      color: #17365d
    }

    @media(max-width:760px) {
      .scorebox {
        grid-template-columns: 1fr
      }

      .hero {
        padding: 22px
      }

      h1 {
        font-size: 1.5rem
      }

      .card {
        padding: 16px
      }

      .btns {
        position: static
      }
    }

    @media print {
      body {
        background: #fff
      }

      .hero,
      .card {
        box-shadow: none
      }

      .btns {
        display: none
      }

      .result {
        display: block !important
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="hero">
      <h1>糖尿病治療薬 理解度テスト</h1>
      <p>各問は「正しいものをすべて選ぶ」または「間違ったものをすべて選ぶ」複数選択式です。提出ボタンを押すと、成績表・正解・解説を表示します。</p>
      <div class="meta">
        <span class="tag">全10問</span>
        <span class="tag">複数選択式</span>
        <span class="tag">薬剤師学習用</span>
      </div>
    </section>

    <section class="card">
      <h2>問題</h2>
      <form id="quizForm"></form>
      <div class="btns">
        <button type="button" id="submitBtn">提出して採点する</button>
        <button type="button" id="resetBtn">リセット</button>
      </div>
    </section>

    <section id="result" class="card result">
      <h2>成績表</h2>
      <div class="scorebox">
        <div class="scoreitem">
          <div>得点</div><b id="scoreText">0 / 10</b>
        </div>
        <div class="scoreitem">
          <div>正答率</div><b id="percentText">0%</b>
        </div>
        <div class="scoreitem">
          <div>判定</div><b id="rankText">-</b>
        </div>
      </div>
      <p id="comment" class="small"></p>
      <div id="summaryTable"></div>
      <h2 style="margin-top:24px">正解と解説</h2>
      <div id="review"></div>
    </section>
  </div>

  <script>
    const questions = [
      {
        q: 'メトホルミンを服用している患者への説明として正しいものをすべて選びなさい。',
        opts: [
          '腎機能低下がある場合は、継続の可否を慎重に確認する',
          '発熱、嘔吐、下痢などで脱水が疑われるときは、自己判断で飲み続けてよい',
          '造影剤を使う検査が予定されているときは、休薬や再開時期を医師の指示で確認する',
          '単独で使う場合でも低血糖が起こりやすいので、毎回間食を勧める',
          '強いだるさ、呼吸が苦しい、吐き気などがあれば早めに受診を案内する'
        ],
        ans: [0, 2, 4],
        exp: '腎機能、脱水、造影剤検査は重要な確認点です。メトホルミンは単独では低血糖が起こりやすい薬ではなく、乳酸アシドーシスを疑う症状があれば受診案内が必要です。'
      },
      {
        q: 'SGLT2阻害薬について間違ったものをすべて選びなさい。',
        opts: [
          '脱水を起こしやすいので、水分摂取と体調確認が大切である',
          '性器感染や尿路感染の副作用に注意する',
          '食事が取れない日でも、いつも通り続ければ問題ない',
          '強いだるさ、吐き気、腹痛、深い呼吸があれば正常血糖ケトアシドーシスを疑う',
          '1型糖尿病では、一般的に単独で使うのが基本である'
        ],
        ans: [2, 4],
        exp: 'CとEが誤りです。SGLT2阻害薬は食事が取れない日でもいつも通り続ければよいわけではなく、体調不良時は脱水やケトアシドーシスに注意します。また、1型糖尿病での単独使用を基本とする薬でもありません。A、B、Dは正しい内容です。'
      },
      {
        q: 'SU薬やグリニド薬の服薬指導で間違ったものをすべて選びなさい。',
        opts: [
          '食事を抜く予定があるときは、低血糖に注意して服用タイミングを確認する',
          'グリニド薬は食直前に服用するのが基本である',
          '低血糖時は、α-GIを飲んでいても砂糖で対応すればよい',
          'SU薬は高齢者で低血糖に特に注意が必要である',
          'SU薬は単独では低血糖を起こさない'
        ],
        ans: [2, 4],
        exp: 'CとEが誤りです。α-GIを服用している患者の低血糖は砂糖では十分に対応できないことがあり、ブドウ糖を使います。また、SU薬は単独でも低血糖を起こすことがあります。A、B、Dは正しい内容です。'
      },
      {
        q: 'α-グルコシダーゼ阻害薬について正しいものをすべて選びなさい。',
        opts: [
          '食直前または食事開始時に服用する',
          '低血糖時は、砂糖よりブドウ糖で対応する',
          'お腹の張りや放屁、下痢が起こりやすい',
          '食後1時間以上たってから飲んでも効果は同じである',
          '単独でも重い低血糖を起こしやすい'
        ],
        ans: [0, 1, 2],
        exp: 'この薬は食後血糖を抑えるため、服用タイミングが重要です。消化管症状が出やすく、低血糖時はブドウ糖で対応します。'
      },
      {
        q: 'DPP-4阻害薬について間違ったものをすべて選びなさい。',
        opts: [
          '単独では低血糖が比較的少ない',
          'SU薬やインスリンと併用するときは低血糖に注意する',
          '持続する強い腹痛があれば、膵炎の可能性も考えて受診を勧める',
          '服用すると必ず体重増加が起こる',
          'かぜ薬と一緒なら必ず禁忌である'
        ],
        ans: [3, 4],
        exp: 'DとEが誤りです。DPP-4阻害薬で必ず体重増加するわけではなく、かぜ薬と一緒なら必ず禁忌というわけでもありません。A、B、Cは正しい内容です。'
      },
      {
        q: 'GLP-1受容体作動薬、GIP/GLP-1受容体作動薬について正しいものをすべて選びなさい。',
        opts: [
          '開始初期に吐き気、嘔吐、食欲不振が出ることがある',
          '単独使用では低血糖は比較的少ない',
          '食欲が落ちているときは、無理に食事量を増やすよう勧める',
          '食べられない状態や強い胃腸症状が続くときは相談を勧める',
          'どの製剤も必ず食前30分に内服する'
        ],
        ans: [0, 1, 3],
        exp: '消化器症状は開始初期に出やすく、単独では低血糖は比較的少ないです。食事が取れない、症状が続く場合は相談を勧めます。'
      },
      {
        q: 'インスリン製剤の指導として正しいものをすべて選びなさい。',
        opts: [
          '自己判断で中止せず、食事量低下や体調不良時は早めに相談する',
          '低血糖症状と、そのときの対処法を確認する',
          '使用前後の保管温度や開封後の扱いを確認する',
          '注射部位は毎回まったく同じ場所に固定するとよい',
          '1型糖尿病では治療の中心になる'
        ],
        ans: [0, 1, 2, 4],
        exp: 'インスリンは低血糖対策、保管、注射手技の確認が重要です。1型糖尿病では治療の中心であり、注射部位は固定せず分散します。'
      },
      {
        q: 'ピオグリタゾンについて正しいものをすべて選びなさい。',
        opts: [
          '浮腫や急な体重増加に注意する',
          '心不全がある患者では悪化に注意する',
          '骨折リスクに注意する',
          '低血糖が多いので必ず食事と一緒に飲む必要がある',
          '肝機能異常の確認が必要なことがある'
        ],
        ans: [0, 1, 2, 4],
        exp: 'ピオグリタゾンでは体液貯留、心不全悪化、骨折リスク、肝機能異常に注意します。低血糖が主な注意点ではありません。'
      },
      {
        q: '糖尿病治療薬とあわせて確認したい相互作用や併用上の注意として正しいものをすべて選びなさい。',
        opts: [
          'ステロイドは血糖を上げることがあるので、開始時は注意する',
          'β遮断薬は低血糖時の動悸などの症状に気づきにくくすることがある',
          '低血糖を起こしやすい薬を使っている患者では、運転や外出前の確認が大切である',
          'NSAIDsは糖尿病治療薬と必ず禁忌である',
          '多量のアルコールは低血糖や食事不良を招きやすい'
        ],
        ans: [0, 1, 2, 4],
        exp: 'ステロイド、β遮断薬、アルコールは血糖管理や低血糖の気づき方に影響します。運転前の確認も重要です。NSAIDsが必ず禁忌というわけではありません。'
      },
      {
        q: 'シックデイや体調不良時の対応として正しいものをすべて選びなさい。',
        opts: [
          '発熱、嘔吐、下痢、食事摂取不良のときは、血糖と脱水に注意する',
          'SGLT2阻害薬使用中は、こうした状況でケトアシドーシスに注意する',
          '低血糖を起こす薬では、食事を抜くときの対応をあらかじめ確認しておく',
          '症状があっても、全ての薬を自己判断で必ず続ける',
          '血糖自己測定をしていない患者でも、低血糖症状の確認は重要である'
        ],
        ans: [0, 1, 2, 4],
        exp: 'シックデイでは脱水、高血糖、低血糖、ケトアシドーシスを意識します。自己判断で全薬を必ず続けるのではなく、休薬や受診の基準を確認します。'
      }
    ];

    const form = document.getElementById('quizForm');

    function letters(arr) {
      return arr.map(i => String.fromCharCode(65 + i)).join('、');
    }

    function same(a, b) {
      return a.length === b.length && a.every(x => b.includes(x));
    }

    function partial(a, b) {
      return a.some(x => b.includes(x)) || b.some(x => a.includes(x));
    }

    function shuffle(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    questions.forEach((item, qi) => {
      const div = document.createElement('div');
      div.className = 'question';
      div.innerHTML = `<div class="qhead">第${qi + 1}問</div><div class="qtext">${item.q}</div>`;
      const shuffledOpts = shuffle(item.opts.map((op, oi) => ({ text: op, originalIndex: oi })));
      shuffledOpts.forEach((choice, oi) => {
        const id = `q${qi}_${oi}`;
        div.innerHTML += `<label class="option" for="${id}"><input type="checkbox" id="${id}" name="q${qi}" value="${choice.originalIndex}">${String.fromCharCode(65 + oi)}. ${choice.text}</label>`;
      });
      form.appendChild(div);
    });

    function grade() {
      let score = 0;
      let rows = '';
      let review = '';

      questions.forEach((item, qi) => {
        const selected = [...document.querySelectorAll(`input[name="q${qi}"]:checked`)].map(e => Number(e.value));
        const ok = same(selected, item.ans);
        if (ok) score++;
        const isPartial = !ok && partial(selected, item.ans);
        const cls = ok ? 'correct' : (isPartial ? 'partial' : 'wrong');
        const badge = ok ? '<span class="badge ok">正解</span>' : (isPartial ? '<span class="badge part">一部正解</span>' : '<span class="badge ng">不正解</span>');
        rows += `<tr><td>第${qi + 1}問</td><td>${ok ? '正解' : (isPartial ? '一部正解' : '不正解')}</td><td>あなたの選択：${selected.length ? letters(selected) : '未選択'}</td><td>正解：${letters(item.ans)}</td></tr>`;
        review += `<div class="review ${cls}">${badge}<strong>第${qi + 1}問</strong><div class="answer">正解：${letters(item.ans)}</div><div>あなたの選択：${selected.length ? letters(selected) : '未選択'}</div><div class="explain">${item.exp}</div></div>`;
      });

      const pct = Math.round(score / questions.length * 100);
      document.getElementById('scoreText').textContent = `${score} / ${questions.length}`;
      document.getElementById('percentText').textContent = `${pct}%`;
      document.getElementById('rankText').textContent = pct >= 90 ? 'A' : pct >= 70 ? 'B' : pct >= 50 ? 'C' : 'D';
      document.getElementById('comment').textContent =
        pct >= 90 ? 'よく理解できています。実務では併用薬と患者背景の確認まで意識してください。' :
        pct >= 70 ? '概ね理解できています。間違えた問題の解説を確認してください。' :
        pct >= 50 ? '基本は押さえていますが、作用機序と併用注意を再確認してください。' :
        '再学習が必要です。まず作用機序、薬剤名、服薬指導の3点を整理してください。';
      document.getElementById('summaryTable').innerHTML = `<table><thead><tr><th>問題</th><th>判定</th><th>選択</th><th>正解</th></tr></thead><tbody>${rows}</tbody></table>`;
      document.getElementById('review').innerHTML = review;
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.getElementById('submitBtn').addEventListener('click', grade);
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.querySelectorAll('input[type="checkbox"]').forEach(e => e.checked = false);
      document.getElementById('result').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>

</html>
