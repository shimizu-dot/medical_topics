<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>睡眠薬 理解度テスト</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #fff;
      --text: #1f2937;
      --muted: #64748b;
      --line: #dbe3ee;
      --blue: #2563eb;
      --blue2: #eaf1ff;
      --green: #047857;
      --green2: #ecfdf5;
      --red: #b91c1c;
      --red2: #fef2f2;
      --amber: #b45309;
      --amber2: #fff7ed;
      --shadow: 0 10px 24px rgba(15, 23, 42, .08)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, #eaf1ff 0, var(--bg) 260px);
      color: var(--text);
      line-height: 1.7
    }

    .wrap {
      max-width: 1040px;
      margin: 32px auto 56px;
      padding: 0 18px
    }

    .hero {
      background: linear-gradient(135deg, #1d4ed8, #4f46e5);
      color: #fff;
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow)
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.9rem;
      line-height: 1.35
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.25rem;
      color: #17365d;
      border-left: 6px solid var(--blue);
      padding-left: 12px
    }

    .hero p {
      margin: 0;
      opacity: .95
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      margin-top: 20px;
      box-shadow: var(--shadow)
    }

    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px
    }

    .tag {
      background: rgba(255, 255, 255, .18);
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 700;
      font-size: .9rem
    }

    .question {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin: 18px 0;
      background: #fff
    }

    .qhead {
      font-weight: 800;
      color: #17365d;
      margin-bottom: 10px
    }

    .qtext {
      font-weight: 700;
      margin-bottom: 10px
    }

    label.option {
      display: block;
      margin: 9px 0;
      padding: 10px 12px;
      border: 1px solid #e5edf7;
      border-radius: 12px;
      background: #fbfdff;
      cursor: pointer
    }

    label.option:hover {
      background: #f3f7ff
    }

    input[type="checkbox"] {
      transform: scale(1.15);
      margin-right: 8px
    }

    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
      position: sticky;
      bottom: 12px;
      background: rgba(246, 248, 251, .9);
      backdrop-filter: blur(8px);
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--line)
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer
    }

    #submitBtn {
      background: var(--blue);
      color: #fff
    }

    #resetBtn {
      background: #e5e7eb;
      color: #111827
    }

    .result {
      display: none
    }

    .scorebox {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      margin: 14px 0
    }

    .scoreitem {
      background: var(--blue2);
      border: 1px solid #cfe0ff;
      border-radius: 16px;
      padding: 16px;
      text-align: center
    }

    .scoreitem b {
      font-size: 1.8rem;
      color: var(--blue)
    }

    .review {
      border-radius: 16px;
      padding: 15px;
      margin: 12px 0;
      border: 1px solid var(--line)
    }

    .correct {
      background: var(--green2);
      border-color: #b7ebd2
    }

    .wrong {
      background: var(--red2);
      border-color: #f4b7b7
    }

    .partial {
      background: var(--amber2);
      border-color: #f2d3aa
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 10px;
      font-weight: 800;
      font-size: .86rem;
      margin-right: 8px
    }

    .badge.ok {
      background: #d1fae5;
      color: var(--green)
    }

    .badge.ng {
      background: #fee2e2;
      color: var(--red)
    }

    .badge.part {
      background: #ffedd5;
      color: var(--amber)
    }

    .small {
      font-size: .92rem;
      color: var(--muted)
    }

    .answer {
      font-weight: 800
    }

    .explain {
      margin-top: 8px
    }

    .hidden {
      display: none !important
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px
    }

    td,
    th {
      border: 1px solid var(--line);
      padding: 10px;
      text-align: left
    }

    th {
      background: #eef4ff;
      color: #17365d
    }

    @media(max-width:760px) {
      .scorebox {
        grid-template-columns: 1fr
      }

      .hero {
        padding: 22px
      }

      h1 {
        font-size: 1.5rem
      }

      .card {
        padding: 16px
      }

      .btns {
        position: static
      }
    }

    @media print {
      body {
        background: #fff
      }

      .hero,
      .card {
        box-shadow: none
      }

      .btns {
        display: none
      }

      .result {
        display: block !important
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <section class="hero">
      <h1>睡眠薬 理解度テスト</h1>
      <p>各問は「正しいものをすべて選ぶ」複数選択式です。1つとは限りません。提出ボタンを押すと、成績表・正解・解説を表示します。</p>
      <div class="meta"><span class="tag">全10問</span><span class="tag">複数選択可</span><span class="tag">薬剤師学習用</span></div>
    </section>

    <section class="card">
      <h2>問題</h2>
      <form id="quizForm"></form>
      <div class="btns">
        <button type="button" id="submitBtn">提出して採点する</button>
        <button type="button" id="resetBtn">リセット</button>
      </div>
    </section>

    <section id="result" class="card result">
      <h2>成績表</h2>
      <div class="scorebox">
        <div class="scoreitem">
          <div>得点</div><b id="scoreText">0 / 10</b>
        </div>
        <div class="scoreitem">
          <div>正答率</div><b id="percentText">0%</b>
        </div>
        <div class="scoreitem">
          <div>判定</div><b id="rankText">-</b>
        </div>
      </div>
      <p id="comment" class="small"></p>
      <div id="summaryTable"></div>
      <h2 style="margin-top:24px">正解と解説</h2>
      <div id="review"></div>
    </section>
  </div>

  <script>
    const questions = [
      { q: 'オレキシン受容体拮抗薬の作用機序として正しいものを選んでください。', opts: ['GABA-A受容体を直接刺激して脳を抑制する', 'オレキシンA・Bによる覚醒維持作用を弱める', 'OX1受容体・OX2受容体を阻害する', '覚醒を保つ神経系の働きを抑え、睡眠へ移行しやすくする'], ans: [1, 2, 3], exp: 'オレキシン受容体拮抗薬は、覚醒維持に関わるオレキシンA・Bの作用をOX1/OX2受容体で遮断します。GABA-A受容体を直接刺激する薬ではありません。' },
      { q: 'オレキシン受容体拮抗薬に該当する薬剤を選んでください。', opts: ['ベルソムラ', 'デエビゴ', 'ハルシオン', 'クービビック', 'ボルズィ'], ans: [0, 1, 3, 4], exp: 'ベルソムラ、デエビゴ、クービビック、ボルズィはいずれもオレキシン受容体拮抗薬です。ハルシオンはトリアゾラムで、ベンゾジアゼピン系です。' },
      { q: 'ベンゾジアゼピン系睡眠薬の特徴として正しいものを選んでください。', opts: ['GABA-A受容体を介して脳の抑制を強める', '筋弛緩作用や抗不安作用を持つものがある', '高齢者では転倒・せん妄・ふらつきに注意が必要', '依存や耐性のリスクは基本的にない'], ans: [0, 1, 2], exp: 'ベンゾジアゼピン系はGABA-A受容体を介して抑制性神経伝達を増強します。催眠以外に筋弛緩・抗不安作用を持つものがあり、依存・耐性、転倒、せん妄に注意が必要です。' },
      { q: '非ベンゾジアゼピン系、いわゆるZ薬に該当するものを選んでください。', opts: ['ゾルピデム', 'ゾピクロン', 'エスゾピクロン', 'ニトラゼパム', 'ブロチゾラム'], ans: [0, 1, 2], exp: 'ゾルピデム、ゾピクロン、エスゾピクロンが代表的なZ薬です。ニトラゼパム、ブロチゾラムはベンゾジアゼピン系です。' },
      { q: 'ベンゾジアゼピン系と非ベンゾジアゼピン系の違いとして正しいものを選んでください。', opts: ['非ベンゾジアゼピン系はベンゾジアゼピン骨格を持たない', 'どちらもGABA-A受容体のベンゾジアゼピン結合部位に関連して作用する', '非ベンゾジアゼピン系は催眠作用に比較的選択的である', '非ベンゾジアゼピン系では健忘や異常行動は絶対に起こらない'], ans: [0, 1, 2], exp: 'Z薬はベンゾジアゼピン骨格を持たず、催眠作用に比較的選択的です。ただし作用部位は近く、健忘や異常行動、依存が起こらないわけではありません。' },
      { q: 'オレキシン受容体拮抗薬の服薬指導として適切なものを選んでください。', opts: ['就寝直前に服用する', '服用後はすぐに布団に入る', '服用後に家事や入浴を済ませてから寝るよう説明する', '翌朝の眠気やふらつきに注意する', '飲酒は避けるよう説明する'], ans: [0, 1, 3, 4], exp: '就寝直前に服用し、服用後はすぐ寝ることが基本です。服用後に活動を続けると眠気、ふらつき、事故のリスクが高まります。飲酒も避けます。' },
      { q: 'オレキシン受容体拮抗薬とベンゾジアゼピン系睡眠薬の併用について正しいものを選んでください。', opts: ['併用は常に禁忌である', '切替目的で一時的に併用されることはあり得る', '漫然とした長期併用は注意が必要', '併用により眠気・ふらつき・転倒リスクが増える可能性がある', '高齢者では特に慎重に確認する'], ans: [1, 2, 3, 4], exp: '併用が常に禁忌というわけではありません。切替中の一時併用はあり得ますが、長期の漫然併用は鎮静過多、転倒、翌朝の眠気の面から注意が必要です。' },
      { q: 'CYP3A関連の相互作用に注意が必要な薬剤・食品として考えるべきものを選んでください。', opts: ['クラリスロマイシン', 'イトラコナゾール', 'グレープフルーツ', 'アゾール系抗真菌薬', '酸化マグネシウム'], ans: [0, 1, 2, 3], exp: 'オレキシン受容体拮抗薬ではCYP3A関連の相互作用確認が重要です。マクロライド系、アゾール系抗真菌薬、グレープフルーツなどは確認対象です。酸化マグネシウムは典型的なCYP3A阻害薬ではありません。' },
      { q: 'オレキシン受容体拮抗薬の副作用・注意点として正しいものを選んでください。', opts: ['翌朝の眠気', 'ふらつき', '悪夢・異常な夢', '睡眠麻痺様症状', '依存リスクがあるため必ず漸減が必要で、急に中止すると全例で重篤な離脱症状が出る'], ans: [0, 1, 2, 3], exp: '主な注意点は翌朝の眠気、ふらつき、悪夢・異常な夢、睡眠麻痺様症状などです。BZD系のような依存・離脱が常に問題になる薬と同じ扱いにはしません。' },
      { q: '薬局で睡眠薬処方を確認する際、疑義照会や処方意図確認を考えたい場面を選んでください。', opts: ['高齢者にベンゾジアゼピン系とオレキシン受容体拮抗薬が長期併用されている', '転倒歴がある患者に複数の睡眠薬が処方されている', '睡眠薬に加えて抗精神病薬や抗ヒスタミン薬など鎮静性薬剤が併用されている', 'ベンゾジアゼピン系からオレキシン受容体拮抗薬へ切替中で、短期間だけ重なっている', '患者が日中の強い眠気を訴えている'], ans: [0, 1, 2, 4], exp: '高齢者、転倒歴、鎮静薬の重複、日中の強い眠気は確認対象です。切替目的が明確で短期間の重複なら理解できる場合がありますが、長期化していないかは確認します。' }
    ];
    const form = document.getElementById('quizForm');
    function letters(arr) { return arr.map(i => String.fromCharCode(65 + i)).join('、') }
    function same(a, b) { return a.length === b.length && a.every(x => b.includes(x)) }
    function partial(a, b) { return a.some(x => b.includes(x)) || b.some(x => a.includes(x)) }
    questions.forEach((item, qi) => {
      const div = document.createElement('div'); div.className = 'question';
      div.innerHTML = `<div class="qhead">第${qi + 1}問</div><div class="qtext">${item.q}</div>`;
      item.opts.forEach((op, oi) => {
        const id = `q${qi}_${oi}`;
        div.innerHTML += `<label class="option" for="${id}"><input type="checkbox" id="${id}" name="q${qi}" value="${oi}">${String.fromCharCode(65 + oi)}. ${op}</label>`;
      });
      form.appendChild(div);
    });
    function grade() {
      let score = 0, rows = '', review = '';
      questions.forEach((item, qi) => {
        const selected = [...document.querySelectorAll(`input[name="q${qi}"]:checked`)].map(e => Number(e.value));
        const ok = same(selected, item.ans); if (ok) score++;
        const cls = ok ? 'correct' : (partial(selected, item.ans) ? 'partial' : 'wrong');
        const badge = ok ? '<span class="badge ok">正解</span>' : (partial(selected, item.ans) ? '<span class="badge part">一部正解</span>' : '<span class="badge ng">不正解</span>');
        rows += `<tr><td>第${qi + 1}問</td><td>${ok ? '正解' : (partial(selected, item.ans) ? '一部正解' : '不正解')}</td><td>あなたの選択：${selected.length ? letters(selected) : '未選択'}</td><td>正解：${letters(item.ans)}</td></tr>`;
        review += `<div class="review ${cls}">${badge}<strong>第${qi + 1}問</strong><div class="answer">正解：${letters(item.ans)}</div><div>あなたの選択：${selected.length ? letters(selected) : '未選択'}</div><div class="explain">${item.exp}</div></div>`;
      });
      const pct = Math.round(score / questions.length * 100);
      document.getElementById('scoreText').textContent = `${score} / ${questions.length}`;
      document.getElementById('percentText').textContent = `${pct}%`;
      document.getElementById('rankText').textContent = pct >= 90 ? 'A' : pct >= 70 ? 'B' : pct >= 50 ? 'C' : 'D';
      document.getElementById('comment').textContent = pct >= 90 ? 'よく理解できています。実務では併用薬と患者背景の確認まで意識してください。' : pct >= 70 ? '概ね理解できています。間違えた問題の解説を確認してください。' : pct >= 50 ? '基本は押さえていますが、作用機序と併用注意を再確認してください。' : '再学習が必要です。まず作用機序、薬剤名、服薬指導の3点を整理してください。';
      document.getElementById('summaryTable').innerHTML = `<table><thead><tr><th>問題</th><th>判定</th><th>選択</th><th>正解</th></tr></thead><tbody>${rows}</tbody></table>`;
      document.getElementById('review').innerHTML = review;
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    document.getElementById('submitBtn').addEventListener('click', grade);
    document.getElementById('resetBtn').addEventListener('click', () => { document.querySelectorAll('input[type="checkbox"]').forEach(e => e.checked = false); document.getElementById('result').style.display = 'none'; window.scrollTo({ top: 0, behavior: 'smooth' }); });
  </script>
</body>

</html>
